server:
  port: 2015
  servlet:
    context-path: /naavetane-api
    error:
      include-message: always
      include-binding-errors: always
      include-stacktrace: never
      include-exception: false
spring:
  profiles:
    active: default
  datasource:
    name: ${DB_NAME:navetane_db}
    host: ${DB_HOST:127.0.0.1}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1995}

    url: jdbc:postgresql://${spring.datasource.host}:5432/${spring.datasource.name}?autoReconnect=true&useSSL=false&createDatabaseIfNotExist=true
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
  application:
    name: NAAVETANE

storage-document:
  file-storage-root-path: ${user.home}//Documents//upload//docs
  template-name: template.vm

